<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#022c22" rx="16" />

  <!-- Left: Shaving (Men) -->
  <g transform="translate(40, 20)">
    <!-- Bald Head Silhouette -->
    <path d="M 60,80 C 60,40 100,40 100,80 L 100,90 C 100,100 90,110 80,110 C 70,110 60,100 60,90 Z" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M 60,60 Q 80,45 100,60" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <!-- Razor -->
    <g transform="translate(10, 40) rotate(-25)">
      <!-- Razor Head -->
      <rect x="30" y="20" width="30" height="8" fill="#fbbf24" rx="1" />
      <rect x="32" y="28" width="26" height="3" fill="#e5e7eb" />
      <!-- Razor Handle -->
      <rect x="42" y="28" width="6" height="40" fill="#fbbf24" rx="2" />
    </g>
    <text x="80" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Shaving (Halq) / الحلق</text>
    <text x="80" y="155" font-family="system-ui, sans-serif" font-size="10" fill="#34d399" text-anchor="middle">(Recommended for Men)</text>
  </g>

  <!-- Right: Trimming (Women / Men) -->
  <g transform="translate(220, 20)">
    <!-- Hair Lock -->
    <path d="M 70,40 Q 60,75 80,95 Q 90,105 75,120" fill="none" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round" />
    <!-- Scissors -->
    <g transform="translate(30, 60) rotate(15)">
      <!-- Scissors Blades -->
      <path d="M 30,20 L 70,15" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
      <path d="M 30,10 L 70,15" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
      <line x1="45" y1="16" x2="45" y2="17" stroke="#111827" stroke-width="3" stroke-linecap="round" />
      <!-- Scissors Handles -->
      <circle cx="20" cy="8" r="8" fill="none" stroke="#fbbf24" stroke-width="3" />
      <circle cx="20" cy="24" r="8" fill="none" stroke="#fbbf24" stroke-width="3" />
    </g>
    <!-- Fingertip measure icon / lock -->
    <rect x="70" y="95" width="20" height="25" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="3,2" rx="4" />
    <text x="100" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#34d399">~1.5 cm</text>
    
    <text x="80" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Trimming (Taqseer) / التقصير</text>
    <text x="80" y="155" font-family="system-ui, sans-serif" font-size="10" fill="#34d399" text-anchor="middle">(All pilgrims / للنساء والرجال)</text>
  </g>
</svg>
