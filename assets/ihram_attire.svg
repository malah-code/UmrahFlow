<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#022c22" rx="16" />
  
  <!-- Left Side: Man -->
  <g transform="translate(60, 15)">
    <!-- Head -->
    <circle cx="60" cy="40" r="18" fill="#e5e7eb" />
    <!-- Neck -->
    <rect x="56" y="58" width="8" height="10" fill="#e5e7eb" />
    <!-- Rida (Upper body) -->
    <path d="M 30,68 C 30,68 50,68 60,68 C 70,68 90,68 90,68 L 85,150 L 35,150 Z" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <path d="M 35,80 Q 60,95 85,80" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.3" />
    <!-- Izar (Lower body) -->
    <path d="M 35,152 L 85,152 L 85,240 L 35,240 Z" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <!-- Belt -->
    <rect x="33" y="152" width="54" height="6" fill="#fbbf24" rx="2" />
    <!-- Feet & Sandals -->
    <path d="M 43,240 L 43,250 L 53,250" fill="none" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round" />
    <path d="M 38,252 L 58,252" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M 67,240 L 67,250 L 77,250" fill="none" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round" />
    <path d="M 62,252 L 82,252" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <!-- Label -->
    <text x="60" y="275" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Men / الرجال</text>
  </g>

  <!-- Right Side: Woman -->
  <g transform="translate(220, 15)">
    <!-- Hijab -->
    <path d="M 40,40 C 40,20 80,20 80,40 C 80,55 75,65 60,65 C 45,65 40,55 40,40 Z" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <!-- Face -->
    <ellipse cx="60" cy="42" rx="10" ry="12" fill="#e5e7eb" />
    <!-- Abaya -->
    <path d="M 33,65 L 87,65 L 97,240 L 23,240 Z" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <path d="M 40,65 L 30,150" stroke="#10b981" stroke-width="1.5" opacity="0.3" />
    <path d="M 80,65 L 90,150" stroke="#10b981" stroke-width="1.5" opacity="0.3" />
    <!-- Feet -->
    <path d="M 48,240 L 48,252" fill="none" stroke="#e5e7eb" stroke-width="4" />
    <path d="M 72,240 L 72,252" fill="none" stroke="#e5e7eb" stroke-width="4" />
    <!-- Label -->
    <text x="60" y="275" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Women / النساء</text>
  </g>
</svg>
