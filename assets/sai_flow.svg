<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#022c22" rx="16" />

  <!-- Safa Hill (Left) -->
  <g transform="translate(20, 90)">
    <path d="M 10,60 L 30,30 L 45,45 L 65,15 L 85,60 Z" fill="#b45309" opacity="0.8" />
    <path d="M 25,60 L 45,25 L 60,40 L 75,10 L 90,60 Z" fill="#d97706" />
    <text x="50" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Safa / الصفا</text>
    <circle cx="50" cy="5" r="4" fill="#fbbf24" />
    <text x="50" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">START (Leg 1)</text>
  </g>

  <!-- Marwah Hill (Right) -->
  <g transform="translate(300, 90)">
    <path d="M 10,60 L 30,35 L 45,48 L 65,20 L 85,60 Z" fill="#b45309" opacity="0.8" />
    <path d="M 20,60 L 40,28 L 55,42 L 70,15 L 90,60 Z" fill="#d97706" />
    <text x="50" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Marwah / المروة</text>
    <circle cx="50" cy="5" r="4" fill="#fbbf24" />
    <text x="50" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">END (Leg 7)</text>
  </g>

  <!-- Walking Path -->
  <path d="M 100,120 L 300,120" stroke="#ffffff" stroke-width="4" stroke-dasharray="8,4" opacity="0.5" />
  
  <!-- Green Running Zone (Middle) -->
  <rect x="150" y="95" width="100" height="50" fill="#10b981" fill-opacity="0.15" rx="8" />
  <line x1="150" y1="120" x2="250" y2="120" stroke="#34d399" stroke-width="6" />
  <!-- Green lights indicators -->
  <circle cx="150" cy="90" r="5" fill="#34d399" />
  <circle cx="200" cy="90" r="5" fill="#34d399" />
  <circle cx="250" cy="90" r="5" fill="#34d399" />
  
  <text x="200" y="80" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">JOGGING ZONE (MEN ONLY)</text>
  <text x="200" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">الهرولة (للرجال فقط)</text>

  <!-- Flow Direction Arrows -->
  <!-- Safa to Marwah (Odd legs) -->
  <path d="M 110,105 L 140,105" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)" />
  <text x="125" y="98" font-family="system-ui, sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle">Leg 1, 3, 5, 7</text>

  <!-- Marwah to Safa (Even legs) -->
  <path d="M 290,135 L 260,135" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)" />
  <text x="275" y="147" font-family="system-ui, sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle">Leg 2, 4, 6</text>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24" />
    </marker>
  </defs>
</svg>
